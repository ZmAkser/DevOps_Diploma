---
- name: Install Docker on Ubuntu hosts
  hosts: ubuntusrvs
  become: true
  vars:
    docker_apt_key_url: "https://download.docker.com/linux/ubuntu/gpg"
    docker_repo_url_template: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: no

    - name: Add Docker's official GPG key
      apt_key:
        url: "{{ docker_apt_key_url }}"
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "{{ docker_repo_url_template }}"
        state: present
        filename: docker-ce

    - name: Install Docker Engine
      apt:
        name: docker-ce
        state: present
        update_cache: no

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Verify Docker installation
      command: docker --version
      register: docker_version_result
      changed_when: false

    - name: Add user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes      

    - name: Show Docker version
      debug:
        msg: "Docker installed. Version: {{ docker_version_result.stdout }}"
