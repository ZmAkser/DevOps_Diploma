---
- name: Install Docker and Yandex CLI on Ubuntu 26.04
  hosts: ubuntusrvs
  become: true
  vars:
    docker_key_url: "https://download.docker.com/linux/ubuntu/gpg"
    docker_key_path: "/etc/apt/keyrings/docker.gpg"
    yc_install_script: "https://storage.yandexcloud.net/yandexcloud-yc/install.sh"

  tasks:
    # --- Базовые пакеты ---
    - name: Ensure apt utilities are present
      ansible.builtin.package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present

    # --- Docker: ключ и репозиторий (без apt_key!) ---
    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key (ASCII armored)
      ansible.builtin.get_url:
        url: "{{ docker_key_url }}"
        dest: "/tmp/docker.gpg.asc"
        mode: "0644"

    - name: Dearmor Docker GPG key into keyring
      ansible.builtin.command:
        cmd: "gpg --batch --dearmor -o {{ docker_key_path }} /tmp/docker.gpg.asc"
        creates: "{{ docker_key_path }}"

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: "{{ docker_key_path }}"
        mode: "0644"

    - name: Add Docker apt repository with signed-by
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by={{ docker_key_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # --- Установка Docker ---
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure Docker service is enabled and started
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --- Yandex CLI: официальный скрипт ---
    - name: Download Yandex CLI install script
      ansible.builtin.get_url:
        url: "{{ yc_install_script }}"
        dest: "/tmp/yc_install.sh"
        mode: "0755"

    - name: Run Yandex CLI install script
      ansible.builtin.shell:
        cmd: "/tmp/yc_install.sh -i /opt/yc -n"
        creates: "/opt/yc/bin/yc"

    - name: Symlink yc to /usr/local/bin
      ansible.builtin.file:
        src: "/opt/yc/bin/yc"
        dest: "/usr/local/bin/yc"
        state: link
      when: ansible_check_mode is not defined

    # --- Пользователь в группу docker ---
    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined and ansible_user != "root"
